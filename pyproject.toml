[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "indicadores-ve"
version = "1.0.0"
description = "Sistema de Indicadores da Vigilância Epidemiológica de Balsas-MA (TED 04 – UNIBALSAS)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Bonifácio Pinto Costa Neto" },
    { name = "Esley Robson Soares Silva Filho" },
    { name = "Gabriel Silva da Rocha" },
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
